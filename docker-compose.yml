services:
  # This is the shared local Datadog Agent for the whole saga — same convention
  # as the RabbitMQ broker below: start it once here, billing-service and
  # execution-service just point DD_AGENT_HOST=localhost at these published
  # ports (their apps run on the host via `pnpm start:dev`, same as this one).
  datadog-agent:
    image: registry.datadoghq.com/agent:7
    container_name: work-order-datadog-agent
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-us5.datadoghq.com}
      - DD_ENV=${DD_ENV:-development}
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_HEALTH_METRICS_ENABLED=true
    ports:
      - '8126:8126' # APM
      - '8125:8125/udp' # dogstatsd
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:16-alpine
    container_name: work-order-postgres
    environment:
      POSTGRES_USER: workorder
      POSTGRES_PASSWORD: workorder
      POSTGRES_DB: workorder
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workorder -d workorder']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: work-order-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: workorder
      RABBITMQ_DEFAULT_PASS: workorder
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
