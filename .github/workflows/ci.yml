name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a release be re-run without a code change — useful when the cluster
  # was recreated and the running image needs to be put back.
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workorder
          POSTGRES_PASSWORD: workorder
          POSTGRES_DB: workorder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workorder" --health-interval 5s
          --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: workorder
          RABBITMQ_DEFAULT_PASS: workorder
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://workorder:workorder@localhost:5432/workorder?schema=public
      RABBITMQ_URL: amqp://workorder:workorder@localhost:5672
      RABBITMQ_QUEUE: work_order_queue
      JWT_SECRET: ci-secret
      EXECUTION_SERVICE_URL: http://localhost:3002
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gates on what actually ships. The runtime image is built from production
      # dependencies only, so a CVE in the build toolchain cannot reach it —
      # blocking on those would stop releases over something not deployed.
      - run: pnpm audit --prod --audit-level=high
      # The rest is reported but not enforced, so it stays visible.
      - run: pnpm audit || true
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm lint:check
      - run: pnpm build
      - run: pnpm test:ci
      # Runs after the coverage gate: the saga scenarios drive the orchestrator
      # through fakes, so they need no database or broker.
      - run: pnpm test:bdd
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Required by cache-to/cache-from: the default docker driver cannot
      # export a build cache, only the buildx one can.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tech-challenge-workshop/work-order-service
          # `main` is what the checked-in manifests reference, so a first
          # `kubectl apply -k` works. The short SHA is what deploy rolls out:
          # an immutable tag makes the rollback target unambiguous.
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same build, different target: keeps the Prisma CLI and migrations/ that
      # the runtime stage drops, so the migration Job has something to run.
      - uses: docker/metadata-action@v5
        id: meta-migrator
        with:
          images: ghcr.io/tech-challenge-workshop/work-order-service-migrator
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the OIDC token exchanged for AWS credentials. There is no
      # long-lived access key anywhere in this workflow.
      id-token: write
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'tech-challenge-dev-eks' }}
      NAMESPACE: tech-challenge
    steps:
      # The cluster is created and destroyed around demos, so a missing role
      # means "no cluster right now", not a failure. Skipping keeps main green.
      - name: Check whether a cluster is configured
        id: guard
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "AWS_DEPLOY_ROLE_ARN is not set — skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build the kubeconfig
        if: steps.guard.outputs.enabled == 'true'
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply the schema migrations
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::7}"
          # The manifest lives in tech-platform, the single source of truth for
          # everything cluster-side. Fetched rather than duplicated so the two
          # cannot drift; the repository is public, so no credential is needed.
          curl -fsSL -o migration-job.yaml \
            "https://raw.githubusercontent.com/tech-challenge-workshop/tech-platform/main/k8s/work-order-service/migration-job.yaml"
          # Recreated each release so it runs against this exact image.
          kubectl -n "$NAMESPACE" delete job work-order-service-migrate --ignore-not-found
          sed "s|work-order-service-migrator:main|work-order-service-migrator:${TAG}|" migration-job.yaml \
            | kubectl -n "$NAMESPACE" create -f -
          # A failed migration must stop the release, never follow it.
          kubectl -n "$NAMESPACE" wait --for=condition=complete \
            job/work-order-service-migrate --timeout=5m

      - name: Roll out the image built by this run
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::7}"
          kubectl -n "$NAMESPACE" set image deployment/work-order-service \
            app="ghcr.io/tech-challenge-workshop/work-order-service:${TAG}"
          # Fails the job if the new pods never become ready, so a broken image
          # surfaces here instead of silently staying in ImagePullBackOff.
          kubectl -n "$NAMESPACE" rollout status deployment/work-order-service --timeout=5m
